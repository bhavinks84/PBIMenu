<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAFR Countries Performance Analysis (Local Preview)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="img/MAF-logo.png" alt="MAF Logo" class="header-logo">
      <h1 class="header-title">MAFR Countries Performance Analysis</h1>
    </div>
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" class="search-input"
             placeholder="Search dashboards... (Ctrl+K)" autocomplete="off">
      <button id="searchClear" class="search-clear" aria-label="Clear search">&#x2715;</button>
    </div>
  </header>

  <main class="accordion-container" id="accordionContainer"></main>
  <div id="resultsCount" class="search-results-count"></div>

  <!-- Load data from menutable.json, then call _menuInit once data is ready.
       Run a local server first: python3 -m http.server 8000 -->
  <script>
    fetch('menutable.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        window.MENU_DATA = data;
        if (window._menuInit) window._menuInit();
      })
      .catch(function(e) {
        console.warn('Could not load menutable.json:', e);
        window.MENU_DATA = [];
        if (window._menuInit) window._menuInit();
      });
  </script>
  <script src="script.js"></script>
</body>
</html>
